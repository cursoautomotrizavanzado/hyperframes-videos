name: Compilar AutoDiag Studio (EXE + APK + render de prueba)
on:
  push:
    branches: [autodiag-studio-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        working-directory: windows
        run: python -m pip install -r requirements.txt
      - name: Prueba de arranque de la interfaz
        working-directory: windows
        continue-on-error: true
        shell: python
        run: |
          import shutil, os, sys, traceback
          shutil.copytree("../cloud", "cloud", dirs_exist_ok=True)
          sys.path.insert(0, ".")
          res = "UI OK"
          try:
              import autodiag_studio_win as A
              app = A.App(); app.update(); app.after(1500, app.destroy); app.mainloop()
          except Exception:
              res = "UI FALLO\n" + traceback.format_exc()
          try:
              import edge_tts, asyncio
              asyncio.run(edge_tts.Communicate("Prueba de voz.", "es-MX-JorgeNeural").save("v.mp3"))
              res += "\nEDGE-TTS OK %d bytes" % os.path.getsize("v.mp3")
          except Exception:
              res += "\nEDGE-TTS FALLO\n" + traceback.format_exc()
          open("../ui_smoke.txt", "w").write(res); print(res)
      - uses: actions/upload-artifact@v4
        with: { name: uismoke, path: ui_smoke.txt }
      - name: PyInstaller
        working-directory: windows
        shell: cmd
        run: |
          if not exist cloud xcopy /E /I /Y ..\cloud cloud
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AutoDiagStudio --icon icon.ico --add-data "cloud;cloud" --add-data "icon.ico;." --collect-data customtkinter --collect-all edge_tts --collect-data certifi autodiag_studio_win.py
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: windows/dist/AutoDiagStudio.exe }

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        continue-on-error: true
        with: { distribution: temurin, java-version: "21" }
      - name: Compilar APK (Capacitor + Gradle)
        working-directory: android
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" > ../android_build_log.txt; java -version 2>> ../android_build_log.txt || true
          (
            set -ex
            npm install --no-audit --no-fund
            rm -rf www && mkdir -p www && cp -r ../web/* www/
            npx cap add android
            npx @capacitor/assets generate --android --iconBackgroundColor "#080D16" --splashBackgroundColor "#080D16" || echo "iconos por defecto"
            sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
            npx cap sync android
            cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../../AutoDiagStudio.apk
          ) 2>&1 | tee -a ../android_build_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: apklog, path: android_build_log.txt }
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: AutoDiagStudio.apk }

  android-test:
    needs: [android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: . }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Dependencias de la prueba
        run: echo "sin dependencias extra"
      - name: Probar APK en emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r AutoDiagStudio.apk
            adb shell am start -n com.autodiag.videostudio/.MainActivity
            sleep 20
            node tools/android_test.js android_test || true
            adb logcat -d -s chromium:V Capacitor:V Capacitor/Console:V AndroidRuntime:E > android_test/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: androidtest, path: android_test }

  test-render:
    runs-on: ubuntu-latest
    env: { CHROME_PATH: /usr/bin/google-chrome }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Render de prueba con el motor real (Edge-TTS + HyperFrames + FFmpeg)
        working-directory: cloud
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core fonts-jetbrains-mono >/dev/null || sudo apt-get install -y -qq ffmpeg fonts-noto-core >/dev/null
          npm install --no-audit --no-fund
          pip install -q edge-tts
          mkdir -p out
          bash render/pipeline.sh ../tools/test_job.json out 2>&1 | tee out/log.txt
          cp out/final.mp4 ../demo_isometrico_9x16.mp4
          cp out/timeline.json ../demo_timeline.json
          mkdir -p outc && bash render/pipeline.sh ../tools/test_carrusel.json outc 2>&1 | tail -5
          for f in outc/carrusel_*.png; do cp "$f" "../demo_$(basename $f)"; done
          cp outc/copy.txt ../demo_carrusel_copy.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: demo, path: "demo_*\ncloud/out/log.txt" }

  publish:
    needs: [windows-exe, android-apk, android-test, test-render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Publicar en la rama autodiag-studio-dist
        run: |
          mkdir pub && cd pub
          find ../art -type f -exec cp {} . \;
          printf "windows=%s\nandroid=%s\nrender=%s\nrun=%s\n" "${{ needs.windows-exe.result }}" "${{ needs.android-apk.result }}" "${{ needs.test-render.result }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > build_report.txt
          ls -la
          git init -q -b autodiag-studio-dist
          git config user.name autodiag-bot && git config user.email autodiag-bot@users.noreply.github.com
          git add -A && git commit -q -m "build ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" autodiag-studio-dist
