<script>

<script>
(function () {
  "use strict";
  var JOB = window.__JOB || { formato: "9:16", titulo: "AutoDiag Video Studio", escenas: [{ tipo: "concepto", titulo: "Vista previa", texto: "Escribe una idea y presiona generar.", datos: { puntos: ["Idea", "Guion", "Animación", "MP4"] } }] };

  var cv = document.getElementById("c");

  /* ---------- Paleta y tipografías ---------- */
  var C = { bg: "#080D16", grid: "#0D1626", grid2: "#14223A", panel: "#172132", panel2: "#0F1828", border: "#2A3B54",
    orange: "#F76015", cyan: "#00E5FF", red: "#FF3B30", green: "#34C759", yellow: "#FFD60A",

  C.screen = "#050A12"; C.hud = "rgba(15,24,40,.92)"; C.box = "rgba(15,24,40,.9)"; C.sub = "#FFFFFF"; C.subDim = "rgba(232,238,247,.55)"; C.gridMode = "mm";
  /* ---------- Estilos visuales (job.estilo) ---------- */

    blueprint: { bg: "#0A2342", grid: "rgba(255,255,255,.06)", grid2: "rgba(255,255,255,.16)", panel: "#0E2C52", panel2: "#0B2546", border: "#3B6A9E",
      screen: "#061A33", hud: "rgba(10,35,66,.94)", box: "rgba(8,30,58,.92)", orange: "#FFB020", dim: "#9DB8D9" },
    carbono: { bg: "#111214", grid: "#17181B", grid2: "#202226", panel: "#1C1E22", panel2: "#141518", border: "#34373D", screen: "#0A0B0D",
      hud: "rgba(20,21,24,.94)", box: "rgba(20,21,24,.92)", cyan: "#3FD0FF", dim: "#8C9099", gridMode: "diag" },
    neon: { bg: "#07020F", grid: "#120724", grid2: "#1E0B3A", panel: "#140A26", panel2: "#0D0619", border: "#4B1F86", screen: "#05010C",
      hud: "rgba(13,6,25,.94)", box: "rgba(13,6,25,.92)", orange: "#FF2BD6", cyan: "#00F0FF", yellow: "#F5FF3B", dim: "#A07FD6" },
    claro: { bg: "#EEF2F7", grid: "#E1E7EF", grid2: "#CFD8E4", panel: "#FFFFFF", panel2: "#F4F7FB", border: "#C5D0DE", screen: "#0B1220",
      hud: "rgba(255,255,255,.95)", box: "rgba(244,247,251,.95)", text: "#0B1220", dim: "#55657D", cyan: "#0091B8", yellow: "#C99A00", green: "#1E9E4A",

  };
  (function () { var st = ESTILOS[String(JOB.estilo || "osciloscopio").toLowerCase()] || {}; for (var k in st) C[k] = st[k]; })();
  var LIGHT = String(JOB.estilo || "").toLowerCase() === "claro";
  var MONO = '"JetBrains Mono","Consolas","DejaVu Sans Mono","Noto Sans Mono",monospace';
  var SANS = '"Inter","Segoe UI","Noto Sans","DejaVu Sans",Arial,sans-serif';
  var TIPO_COLOR = { voltaje: C.red, alimentacion: C.red, positivo: C.red, masa: C.green, tierra: C.green,
    senal: C.cyan, corriente: C.cyan, frecuencia: C.cyan, control: C.yellow, pwm: C.yellow, can: C.yellow, lin: C.yellow,
    falla: C.orange, temperatura: C.orange, resistencia: C.cyan, tiempo: C.yellow, rpm: C.cyan };
  var TIPO_LABEL = { portada: "PORTADA", osciloscopio: "OSCILOSCOPIO", pwm: "PWM · INYECTOR", rele: "RELÉ ISO", pinout: "PINOUT ECU", concepto: "CONCEPTO", libre: "SIMULACIÓN" };

  /* ---------- Layout (zonas seguras) ---------- */
  var L = WIDE ? {
    hud: { x: 0, y: 0, w: 1920, h: 70 },
    hook: { x: 40, y: 8, w: 1840, h: 56 },
    stage: { x: 30, y: 86, w: 1280, h: 830 },
    rack: { x: 1326, y: 86, w: 564, h: 830 },
    subs: { x: 60, y: 930, w: 1800, h: 140 }, subFont: 54, subChars: 46
  } : {
    hook: { x: 60, y: 100, w: 880, h: 180 },
    stage: { x: 50, y: 290, w: 880, h: 790 },
    rack: { x: 50, y: 1090, w: 880, h: 290 },
    subs: { x: 60, y: 1400, w: 820, h: 240 }, subFont: 66, subChars: 22
  };

  /* ---------- Línea de tiempo ---------- */
  function cleanWord(w) { return String(w || "").replace(/\s+/g, " ").trim(); }
  function buildWhisperTimeline(segments, targetDuration) {
    var all = [], segIdx = [];
    segments.forEach(function (s, i) {
      String(s || "").split(/\s+/).filter(Boolean).forEach(function (w) { all.push(w); segIdx.push(i); });
    });
    if (!all.length) return { duration: targetDuration || 6, words: [], scenes: segments.map(function () { return {}; }) };
    var weights = all.map(function (w) { return w.replace(/[^\wÁÉÍÓÚÜÑáéíóúüñ]/g, "").length + 2 + (/[.,;:!?…]$/.test(w) ? 3.5 : 0); });
    var sum = weights.reduce(function (a, b) { return a + b; }, 0);
    var dur = targetDuration || Math.max(4, all.length / 2.55 + 0.9);
    var lead = 0.35, usable = dur - lead - 0.5, t = lead, words = [];
    all.forEach(function (w, i) {
      var d = usable * weights[i] / sum, pause = /[.,;:!?…]$/.test(w) ? Math.min(0.28, d * 0.4) : 0;
      words.push({ word: w, start: +t.toFixed(3), end: +(t + d - pause).toFixed(3), seg: segIdx[i] });
      t += d;
    });

  }
  function finishTimeline(tl, nSeg) {
    var scenes = [];
    for (var i = 0; i < nSeg; i++) {
      var first = null;
      for (var k = 0; k < tl.words.length; k++) if (tl.words[k].seg === i) { first = tl.words[k]; break; }
      scenes.push({ start: first ? first.start : null });
    }
    for (i = 0; i < nSeg; i++) if (scenes[i].start == null) scenes[i].start = i ? scenes[i - 1].start + 1 : 0;
    scenes[0].start = 0;
    for (i = 0; i < nSeg; i++) scenes[i].end = i < nSeg - 1 ? scenes[i + 1].start : tl.duration;
    tl.scenes = scenes;

  }
  window.buildWhisperTimeline = buildWhisperTimeline;

  var SC = (JOB.escenas || []).length ? JOB.escenas : [{ tipo: "concepto", texto: JOB.guion_voz || "" }];
  var TL = window.__TIMELINE;
  if (!TL || !TL.words) TL = buildWhisperTimeline(SC.map(function (s) { return s.texto; }), null);
  else if (!TL.scenes || TL.scenes.length !== SC.length) TL = finishTimeline(TL, SC.length);
  var D = TL.duration;
  var PORTADA = 0.9;

  /* ---------- Utilidades ---------- */
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function ease(x) { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function easeOut(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
  function lerp(a, b, x) { return a + (b - a) * x; }
  function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function num(v, d) { var n = parseFloat(v); return isFinite(n) ? n : d; }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function font(px, w, fam) { ctx.font = (w || 700) + " " + px + "px " + (fam || SANS); }
  function text(s, x, y, color, align, base) { ctx.fillStyle = color; ctx.textAlign = align || "left"; ctx.textBaseline = base || "alphabetic"; ctx.fillText(s, x, y); }
  function wrap(s, maxW) {
    var words = String(s || "").split(/\s+/).filter(Boolean), lines = [], cur = "";
    words.forEach(function (w) { var test = cur ? cur + " " + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; });
    if (cur) lines.push(cur); return lines;
  }
  function fitFont(s, maxW, maxH, maxPx, minPx, weight, maxLines, fam) {
    for (var px = maxPx; px >= minPx; px -= 2) { font(px, weight, fam); var ls = wrap(s, maxW); if (ls.length <= (maxLines || 3) && ls.length * px * 1.12 <= maxH) return { px: px, lines: ls }; }
    font(minPx, weight, fam); return { px: minPx, lines: wrap(s, maxW).slice(0, maxLines || 3) };
  }
  function panel(r, title, accent) {
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 24; rr(r.x, r.y, r.w, r.h, 18); ctx.fillStyle = C.panel; ctx.fill(); ctx.restore();
    rr(r.x + .5, r.y + .5, r.w - 1, r.h - 1, 18); ctx.strokeStyle = C.border; ctx.lineWidth = 2; ctx.stroke();
    if (title) { font(WIDE ? 22 : 24, 700, MONO); text(title, r.x + 22, r.y + 38, accent || C.dim); ctx.fillStyle = accent || C.cyan; ctx.fillRect(r.x + 22, r.y + 48, 46, 3); }
  }
  function glowLine(color, width, blur) { ctx.strokeStyle = color; ctx.lineWidth = width; ctx.shadowColor = color; ctx.shadowBlur = blur || 12; ctx.lineJoin = "round"; ctx.lineCap = "round"; }
  function sceneAt(t) { for (var i = SC.length - 1; i >= 0; i--) if (t >= TL.scenes[i].start) return i; return 0; }

  /* ---------- Fondo milimetrado ---------- */
  function background() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    if (C.gridMode === "diag") { ctx.lineWidth = 6; ctx.strokeStyle = C.grid; ctx.beginPath(); for (var d = -H; d < W; d += 16) { ctx.moveTo(d, 0); ctx.lineTo(d + H, H); } ctx.stroke(); return; }
    ctx.lineWidth = 1; ctx.strokeStyle = C.grid; ctx.beginPath();
    for (var x = 0; x <= W; x += 20) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (var y = 0; y <= H; y += 20) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke(); ctx.strokeStyle = C.grid2; ctx.beginPath();
    for (x = 0; x <= W; x += 100) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (y = 0; y <= H; y += 100) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
  }

  /* ---------- Portada (primer cuadro claro con título) ---------- */
  function portada(alpha) {
    if (alpha <= 0) return;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.fillStyle = C.light; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(11,18,32,.06)"; ctx.lineWidth = 1; ctx.beginPath();
    for (var x = 0; x <= W; x += 40) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (var y = 0; y <= H; y += 40) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
    var title = JOB.titulo || (SC[0] && SC[0].titulo) || "Diagnóstico";
    var box = WIDE ? { x: 120, y: 300, w: 1400, h: 420 } : { x: 80, y: 520, w: 840, h: 640 };
    ctx.fillStyle = C.orange; ctx.fillRect(box.x, box.y - 40, 120, 14);
    var f = fitFont(title.toUpperCase(), box.w, box.h, WIDE ? 120 : 112, 54, 900, 5);
    font(f.px, 900); f.lines.forEach(function (ln, i) { text(ln, box.x, box.y + f.px * (i + 1) * 1.05, C.ink); });
    var yb = box.y + f.px * f.lines.length * 1.05 + 60;
    if (JOB.subtitulo) { font(WIDE ? 44 : 46, 600); wrap(JOB.subtitulo, box.w).slice(0, 2).forEach(function (ln, i) { text(ln, box.x, yb + i * 58, "#3A4A62"); }); yb += 140; }
    var chip = (TIPO_LABEL[(SC[1] || SC[0] || {}).tipo] || "DIAGNÓSTICO");
    font(WIDE ? 28 : 30, 700, MONO); var cw = ctx.measureText(chip).width + 48;
    rr(box.x, yb, cw, 60, 30); ctx.fillStyle = C.ink; ctx.fill(); text(chip, box.x + 24, yb + 41, C.cyan);
    ctx.restore();
  }

  /* ---------- Gancho / título de escena ---------- */
  function hook(sc, local, alpha) {
    var r = L.hook, label = sc.etiqueta || TIPO_LABEL[sc.tipo] || "DIAGNÓSTICO", title = sc.titulo || JOB.titulo || "";
    ctx.save(); ctx.globalAlpha = alpha;
    if (WIDE) {
      ctx.fillStyle = C.hud; ctx.fillRect(0, 0, W, 70); ctx.fillStyle = C.border; ctx.fillRect(0, 70, W, 2);
      font(22, 700, MONO); var cw = ctx.measureText(label).width + 36; rr(r.x, 17, cw, 38, 19); ctx.fillStyle = C.orange; ctx.fill(); text(label, r.x + 18, 44, "#fff");
      font(36, 800); text(title, r.x + cw + 24, 48, C.text);
    } else {
      var a = easeOut(local / .45);
      font(28, 700, MONO); var cw2 = ctx.measureText(label).width + 40;
      rr(r.x, r.y, cw2, 50, 25); ctx.fillStyle = C.orange; ctx.fill(); text(label, r.x + 20, r.y + 35, "#fff");
      var f = fitFont(title, r.w, r.h - 66, 68, 40, 900, 2);
      font(f.px, 900); f.lines.forEach(function (ln, i) { text(ln, r.x + (1 - a) * -30, r.y + 66 + f.px * (i + 1) * 1.02, C.text); });
    }
    ctx.restore();
  }

  /* ---------- Osciloscopio ---------- */
  function niceDiv(ms) { var c = [0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500]; for (var i = 0; i < c.length; i++) if (c[i] >= ms) return c[i]; return 1000; }
  function niceV(v) { var c = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50]; for (var i = 0; i < c.length; i++) if (c[i] >= v) return c[i]; return 100; }
  function scopeScreen(r) {
    var g = { x: r.x + 24, y: r.y + 70, w: r.w - 48, h: r.h - 150 };
    rr(g.x - 6, g.y - 6, g.w + 12, g.h + 12, 10); ctx.fillStyle = C.screen; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(0,229,255,.12)"; ctx.beginPath();
    for (var i = 0; i <= 10; i++) { var x = g.x + g.w * i / 10; ctx.moveTo(x + .5, g.y); ctx.lineTo(x + .5, g.y + g.h); }
    for (i = 0; i <= 8; i++) { var y = g.y + g.h * i / 8; ctx.moveTo(g.x, y + .5); ctx.lineTo(g.x + g.w, y + .5); }
    ctx.stroke(); ctx.strokeStyle = "rgba(0,229,255,.3)"; ctx.beginPath();
    ctx.moveTo(g.x, g.y + g.h / 2); ctx.lineTo(g.x + g.w, g.y + g.h / 2); ctx.moveTo(g.x + g.w / 2, g.y); ctx.lineTo(g.x + g.w / 2, g.y + g.h);
    for (i = 0; i <= 50; i++) { var tx = g.x + g.w * i / 50; ctx.moveTo(tx, g.y + g.h / 2 - 5); ctx.lineTo(tx, g.y + g.h / 2 + 5); }
    ctx.stroke(); return g;
  }
  function trace(g, fn, windowMs, vdiv, offsetDiv, color, progress, width) {

    ctx.save(); rr(g.x, g.y, g.w, g.h, 4); ctx.clip();
    glowLine(color, width || 4, 14); ctx.beginPath();
    for (var px = 0; px <= n; px++) {
      var v = fn(px / g.w * windowMs), y = g.y + g.h / 2 - (v / vdiv + offsetDiv) * divH;
      y = clamp(y, g.y - 4, g.y + g.h + 4); if (px === 0) ctx.moveTo(g.x + px, y); else ctx.lineTo(g.x + px, y);

    ctx.restore();
  }
  function sweep(local) { var cyc = local % 7; return clamp(cyc / 1.8, 0, 1); }
  function chLabel(g, i, txt, color) { font(WIDE ? 22 : 24, 700, MONO); var x = g.x + i * (g.w / 2); rr(x, g.y + g.h + 22, 18, 18, 4); ctx.fillStyle = color; ctx.fill(); text(txt, x + 28, g.y + g.h + 39, C.text); }

  function drawOsciloscopio(sc, r, local) {
    var d = sc.datos || {}, senal = String(d.senal || "ckp_inductivo").toLowerCase();
    var rpm = num(d.rpm, 800), teeth = Math.round(num(d.dientes, 60)), miss = Math.round(num(d.faltantes, 2)), falla = d.falla || null;
    panel(r, "OSCILOSCOPIO · " + senal.replace(/_/g, " ").toUpperCase(), C.cyan);
    var g = scopeScreen(r), rev = 60000 / rpm;
    var msdiv = d.escala_ms ? num(d.escala_ms, 10) : niceDiv(rev * 0.6 / 10), win = msdiv * 10;
    var degPerMs = rpm * 0.006, winDeg = win * degPerMs, pitch = 360 / teeth;
    var gapCenter = 360 - pitch * miss / 2, th0 = ((gapCenter - 0.55 * winDeg) % 720 + 720) % 720;
    var vpp = num(d.vpp, Math.max(0.8, Math.min(60, rpm / 200))), A = vpp / 2, prog = sweep(local);

      else { v = A * Math.sin(2 * Math.PI * ph); if (falla === "diente_danado" && i === Math.floor(teeth / 3)) v *= 0.3; }

    }

      if (falla === "sin_senal") return 0; if (i >= teeth - miss) return 5; return ph < 0.5 ? 5 : 0.2;
    }
    function cmpHall(tms) { var c = ((theta(tms) % 720) + 720) % 720; return (c > 90 && c < 270) ? 5 : 0.2; }

    else chans.push({ fn: ckpInd, v: niceV(vpp / 6), off: senal === "ckp_cmp" ? 1.6 : 0, c: C.cyan, l: "CKP " + niceV(vpp / 6) + " V/div" });
    if (senal === "ckp_cmp") chans.push({ fn: cmpHall, v: 5, off: -3.2, c: C.yellow, l: "CMP 5 V/div" });
    chans.forEach(function (ch, i) { trace(g, ch.fn, win, ch.v, ch.off, ch.c, prog); chLabel(g, i, ch.l, ch.c); });
    font(WIDE ? 22 : 24, 700, MONO); text(msdiv + " ms/div · " + Math.round(rpm) + " RPM", g.x + g.w, r.y + 38, C.dim, "right");
    if (d.resaltar === "diente_faltante" && senal.indexOf("cmp") !== 0 && prog > 0.6) {
      var a = clamp((prog - 0.6) / 0.25, 0, 1), xg = 0.55 * g.w, wg = (pitch * miss / winDeg) * g.w * 1.25;

      ctx.save(); ctx.globalAlpha = a; ctx.setLineDash([12, 8]); ctx.lineWidth = 4; ctx.strokeStyle = C.orange; ctx.shadowColor = C.orange; ctx.shadowBlur = 18 * pulse;
      ctx.strokeRect(g.x + xg - wg / 2, g.y + 14, wg, g.h - 28); ctx.setLineDash([]); ctx.shadowBlur = 0;
      font(WIDE ? 24 : 28, 800, MONO); var lbl = d.etiqueta_resaltado || "HUECO " + teeth + "-" + miss; var lw = ctx.measureText(lbl).width + 28;
      rr(g.x + xg - lw / 2, g.y + 22, lw, 44, 8); ctx.fillStyle = C.orange; ctx.fill(); text(lbl, g.x + xg, g.y + 53, "#fff", "center"); ctx.restore();
    }
  }

  /* ---------- PWM / Inyector ---------- */
  function drawPwm(sc, r, local) {

    function fit() { var s = Math.min(innerWidth / W, innerHeight / H); root.style.transform = "translate(" + (innerWidth - W * s) / 2 + "px," + (innerHeight - H * s) / 2 + "px) scale(" + s + ")"; }
    addEventListener("resize", fit); fit();
    var playing = true, base = performance.now(), offset = 0;
    function now() { return playing ? offset + (performance.now() - base) / 1000 : offset; }
    function loop() { var t = now(); if (t > D + 0.8) { offset = 0; base = performance.now(); t = 0; } render(Math.min(t, D)); try { parent.postMessage({ type: "ad-time", t: t, d: D }, "*"); } catch (e) {} requestAnimationFrame(loop); }
    addEventListener("message", function (ev) {
      var m = ev.data || {};
      if (m.type === "ad-seek") { offset = +m.t || 0; base = performance.now(); }
      if (m.type === "ad-play") { if (!playing) { playing = true; base = performance.now(); } }
      if (m.type === "ad-pause") { offset = now(); playing = false; }
    });
    addEventListener("click", function () { if (playing) { offset = now(); playing = false; } else { playing = true; base = performance.now(); } });
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
